<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Brand Deals Dashboard</title>
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #18181f;
      --surface2: #1f1f28;
      --border: #2a2a38;
      --text: #f0f0f5;
      --muted: #7a7a96;
      --accent: #7c6dfa;
      --accent2: #56cfb2;
      --green: #3ecf8e;
      --yellow: #f5a623;
      --red: #e05c5c;
      --card-radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    /* HEADER */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .logo-text { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
    .logo-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
    .header-meta { font-size: 13px; color: var(--muted); }
    .header-meta span { color: var(--accent2); font-weight: 500; }

    /* STATS BAR */
    .stats-bar {
      display: flex;
      gap: 16px;
      padding: 20px 32px;
      flex-wrap: wrap;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      padding: 16px 22px;
      flex: 1;
      min-width: 160px;
    }
    .stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
    .stat-value { font-size: 28px; font-weight: 700; letter-spacing: -1px; }
    .stat-value.green { color: var(--green); }
    .stat-value.yellow { color: var(--yellow); }
    .stat-value.purple { color: var(--accent); }
    .stat-value.teal { color: var(--accent2); }

    /* COLUMNS */
    .columns {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
      padding: 0 32px 40px;
    }
    @media (max-width: 900px) {
      .columns { grid-template-columns: 1fr; }
    }

    .column-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .column-title { font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }
    .column-count {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      color: var(--muted);
      margin-left: auto;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
    }
    .dot.yellow { background: var(--yellow); }
    .dot.green { background: var(--green); }
    .dot.muted { background: var(--muted); }

    /* DEAL CARDS */
    .deal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      padding: 16px;
      margin-bottom: 12px;
      transition: border-color 0.2s, transform 0.15s;
      cursor: default;
    }
    .deal-card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .deal-brand {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .deal-amount {
      font-size: 14px;
      font-weight: 700;
      color: var(--green);
    }
    .deal-amount.pending { color: var(--yellow); }
    .deal-type {
      display: inline-block;
      font-size: 11px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 20px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      margin-bottom: 8px;
    }
    .deal-notes {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }
    .deal-date {
      font-size: 11px;
      color: var(--border);
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      opacity: 0.7;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 13px;
    }
    .empty-icon { font-size: 32px; margin-bottom: 10px; opacity: 0.4; }

    /* BADGE */
    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge.delivered { background: rgba(62,207,142,0.15); color: var(--green); }
    .badge.negotiating { background: rgba(245,166,35,0.15); color: var(--yellow); }
    .badge.confirmed { background: rgba(124,109,250,0.15); color: var(--accent); }
    .badge.new { background: rgba(86,207,178,0.15); color: var(--accent2); }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🎬</div>
    <div>
      <div class="logo-text">Brand Deals</div>
      <div class="logo-sub">Creator Dashboard</div>
    </div>
  </div>
  <div class="header-meta">Last updated: <span id="last-updated">—</span></div>
</header>

<div class="stats-bar">
  <div class="stat-card">
    <div class="stat-label">Pipeline Value</div>
    <div class="stat-value purple" id="stat-pipeline">$0</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Active Deals</div>
    <div class="stat-value green" id="stat-active">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">In Talks</div>
    <div class="stat-value yellow" id="stat-talking">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Deals Closed</div>
    <div class="stat-value teal" id="stat-finished">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Total Earned</div>
    <div class="stat-value teal" id="stat-earned">$0</div>
  </div>
</div>

<div class="columns">
  <!-- TALKING -->
  <div>
    <div class="column-header">
      <span class="dot yellow"></span>
      <span class="column-title">In Conversation</span>
      <span class="column-count" id="count-talking">0</span>
    </div>
    <div id="list-talking"></div>
  </div>

  <!-- ACTIVE -->
  <div>
    <div class="column-header">
      <span class="dot green"></span>
      <span class="column-title">Active Deals</span>
      <span class="column-count" id="count-active">0</span>
    </div>
    <div id="list-active"></div>
  </div>

  <!-- FINISHED -->
  <div>
    <div class="column-header">
      <span class="dot muted"></span>
      <span class="column-title">Finished Deals</span>
      <span class="column-count" id="count-finished">0</span>
    </div>
    <div id="list-finished"></div>
  </div>
</div>

<script>
  const DEALS_URL = 'deals.json?t=' + Date.now();

  function fmt(amount) {
    return amount ? '$' + Number(amount).toLocaleString() : null;
  }

  function card(deal, stage) {
    const amount = deal.amount ? `<span class="deal-amount${stage === 'talking' ? ' pending' : ''}">${fmt(deal.amount)}</span>` : '';
    const badge = deal.status ? `<span class="badge ${deal.status.toLowerCase()}">${deal.status}</span>` : '';
    const type = deal.type ? `<span class="deal-type">${deal.type}</span>` : '';
    const notes = deal.notes ? `<div class="deal-notes">${deal.notes}</div>` : '';
    const date = deal.date ? `<div class="deal-date">${deal.date}</div>` : '';
    return `
      <div class="deal-card">
        <div class="deal-brand">
          <span>${deal.brand}</span>
          ${amount}
        </div>
        ${type}
        ${badge}
        ${notes}
        ${date}
      </div>`;
  }

  function empty() {
    return `<div class="empty-state"><div class="empty-icon">📭</div>Nothing here yet</div>`;
  }

  fetch(DEALS_URL)
    .then(r => r.json())
    .then(data => {
      const talking = data.talking || [];
      const active = data.active || [];
      const finished = data.finished || [];

      document.getElementById('last-updated').textContent =
        data.last_updated ? new Date(data.last_updated).toLocaleString('en-IN', {dateStyle:'medium', timeStyle:'short'}) : '—';

      document.getElementById('count-talking').textContent = talking.length;
      document.getElementById('count-active').textContent = active.length;
      document.getElementById('count-finished').textContent = finished.length;

      document.getElementById('stat-active').textContent = active.length;
      document.getElementById('stat-talking').textContent = talking.length;
      document.getElementById('stat-finished').textContent = finished.length;

      const pipeline = [...talking, ...active].reduce((s, d) => s + (d.amount || 0), 0);
      const earned = finished.reduce((s, d) => s + (d.amount || 0), 0);
      document.getElementById('stat-pipeline').textContent = fmt(pipeline) || '$0';
      document.getElementById('stat-earned').textContent = fmt(earned) || '$0';

      document.getElementById('list-talking').innerHTML = talking.length ? talking.map(d => card(d, 'talking')).join('') : empty();
      document.getElementById('list-active').innerHTML = active.length ? active.map(d => card(d, 'active')).join('') : empty();
      document.getElementById('list-finished').innerHTML = finished.length ? finished.map(d => card(d, 'finished')).join('') : empty();
    })
    .catch(() => {
      ['talking','active','finished'].forEach(s => {
        document.getElementById('list-' + s).innerHTML = empty();
      });
    });
</script>
</body>
</html>
